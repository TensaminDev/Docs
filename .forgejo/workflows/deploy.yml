on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: nixos
    steps:
      - name: Check out repo
        uses: https://data.forgejo.org/actions/checkout@v7

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Deploy
        run: rsync -a --delete dist/ /var/lib/www/tensamin-docs/
