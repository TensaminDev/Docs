name: Deploy documentation

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, linux, nixos]
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Deploy
        run: rsync -a --delete dist/ /var/lib/www/tensamin-docs/
